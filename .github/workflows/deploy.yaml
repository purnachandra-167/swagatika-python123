name: Deploy

on:
  push:
    branches: [next-js-deployment]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v2

      - name: Install SonarQube scanner
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - uses: SonarSource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: 201076423/helloworld:nodejs

      - name: Deploy in EC2
        env:
          PRIVATE_KEY: ${{ secrets.AWS_UBUNTU_PRIV_KEY  }}
          HOSTNAME: ${{ secrets.HOSTNAME  }}
          USER_NAME: ${{ secrets.HOSTNAME_UBUNTU  }}

        run: |
          echo "$PRIVATE_KEY" > private_key && chmod 600 private_key
          ssh -o StrictHostKeyChecking=no -i private_key ${USER_NAME}@${HOSTNAME} '
          docker pull 201076423/helloworld:nodejs
          docker run -p 8080:8080 -d 201076423/helloworld:nodejs
          echo "all good"
          '
